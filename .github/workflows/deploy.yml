name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # needed to assume the AWS role via OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          # Files in the repo that are not part of the website. They go last in
          # each command because later filters win (keeps partials/*.html out).
          not_site=(
            --exclude ".git/*" --exclude ".github/*"
            --exclude "partials/*" --exclude "tools/*"
            --exclude "README.md" --exclude "LICENSE"
            --exclude ".gitignore" --exclude ".gitattributes"
          )

          # HTML changes often, so browsers re-check it after 5 minutes.
          aws s3 sync . "s3://$BUCKET" --delete \
            --exclude "*" --include "*.html" "${not_site[@]}" \
            --cache-control "public, max-age=300"

          # CSS, JS, images and fonts can be cached for a day.
          aws s3 sync . "s3://$BUCKET" --delete \
            --exclude "*.html" "${not_site[@]}" \
            --cache-control "public, max-age=86400"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
